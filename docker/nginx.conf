# nginx — NOC Barito Utara (Laravel 12 + Inertia)
# Port 80 di container → dipublikasikan ke 3003 di host.

user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    server_tokens   off;

    # Upload foto tiket (maks 10M di php.ini)
    client_max_body_size 12m;
    client_body_buffer_size 1m;

    server {
        listen 80;
        server_name _;

        root /var/www/html/public;
        index index.php;

        # ── Foto tiket: sajikan langsung dari storage/app/uploads ──
        location ^~ /uploads/ {
            alias /var/www/html/storage/app/uploads/;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            try_files $uri =404;
        }

        # ── Aset statis Vite (hashed) → cache lama ──
        location ^~ /build/ {
            access_log off;
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location ~* \.(?:js|css|png|jpe?g|gif|svg|ico|webp|avif|woff2?|ttf|eot|map|txt)$ {
            expires 7d;
            add_header Cache-Control "public";
            try_files $uri =404;
            access_log off;
        }

        # ── Semua request dinamis → Laravel ──
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /index.php {
            include /etc/nginx/fastcgi_params;
            # $http_host (host + port) supaya URL generator akurat di port 3003
            fastcgi_param HTTP_HOST $http_host;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            fastcgi_param HTTP_PROXY "";
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_read_timeout 120s;
            fastcgi_buffer_size 32k;
            fastcgi_buffers 16 16k;
        }

        # Tidak ada endpoint PHP selain index.php
        location ~ \.php$ {
            return 404;
        }
    }
}
